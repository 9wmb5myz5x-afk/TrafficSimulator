# XcodeGen spec — the source of truth for TrafficSimulator.xcodeproj.
# Regenerate with:  xcodegen generate
# CI regenerates and fails on drift, so commit both this file and the project.
name: TrafficSimulator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TrafficEngine:
    path: TrafficEngine
targets:
  TrafficSimulator:
    type: application
    platform: iOS
    sources:
      - path: TrafficSimulatorApp
    dependencies:
      - package: TrafficEngine
        product: TrafficEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrafficSimulator
        PRODUCT_NAME: TrafficSimulator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Traffic City
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  TrafficSimulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrafficSimulatorUITests
    dependencies:
      - target: TrafficSimulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrafficSimulatorUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TrafficSimulator
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  TrafficSimulator:
    build:
      targets:
        TrafficSimulator: all
        TrafficSimulatorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TrafficSimulatorUITests
          parallelizable: false
    archive:
      config: Release
